apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: job-pipeline
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: cicd-security-pipeline/gateway:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: job-pipeline-config}
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: job-pipeline
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
