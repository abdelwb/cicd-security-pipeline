# GitLab CI/CD pipeline for the job-processing demo app.
#
# Goal of this file (see README.md "CI/CD & security automation" section):
#   1. Run the real pytest suite as a required MR check (test job).
#   2. Build the two service images and push them to the project's
#      Container Registry.
#   3. Wire GitLab's managed vulnerability scanners (SAST, Secret Detection,
#      Dependency Scanning, Container Scanning) directly into merge request
#      pipelines, so findings show up in the MR's Security widget before
#      anything merges — not as a separate, easy-to-ignore report.
#
# `workflow:rules` below is the standard GitLab pattern to get exactly one
# pipeline per push: a merge request pipeline while an MR is open, otherwise
# a branch pipeline on the default branch. Running on MR pipelines is what
# makes the scanners populate the MR security widget.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - build
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GATEWAY_IMAGE: "$CI_REGISTRY_IMAGE/gateway:$CI_COMMIT_SHORT_SHA"
  WORKER_IMAGE: "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA"
  # GitLab's SAST/Secret-Detection/Dependency-Scanning/Container-Scanning
  # templates default to running only on branch pipelines (to avoid
  # duplicate scans between an MR pipeline and its target branch), which
  # would leave them off the MR entirely under our merge-request-pipeline
  # workflow below. This flag is the documented opt-in that makes them run
  # in the merge request pipeline instead, which is the whole point here:
  # https://docs.gitlab.com/ci/pipelines/merge_request_pipelines/
  AST_ENABLE_MR_PIPELINES: "true"

default:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]

lint:
  stage: lint
  script:
    - pip install ruff==0.6.9
    - ruff check .

test:
  stage: test
  script:
    - pip install -r requirements-dev.txt
    - pytest --junitxml=report.xml
        --cov=common --cov=gateway --cov=worker
        --cov-report=xml --cov-report=term
  coverage: '/^TOTAL.*\s+(\d+)%$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f gateway/Dockerfile -t "$GATEWAY_IMAGE" .
    - docker push "$GATEWAY_IMAGE"
    - docker build -f worker/Dockerfile -t "$WORKER_IMAGE" .
    - docker push "$WORKER_IMAGE"

# --- Vulnerability scanning, wired into the MR pipeline -----------------
# GitLab-managed templates: https://docs.gitlab.com/ee/user/application_security/
# Each contributes a job (SAST, Secret Detection, Dependency Scanning run
# purely against source; Container Scanning below is repointed at the
# images this pipeline just built).
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

container_scanning:
  stage: security
  needs: ["build"]
  variables:
    CS_IMAGE: "$GATEWAY_IMAGE"

container_scanning_worker:
  extends: container_scanning
  variables:
    CS_IMAGE: "$WORKER_IMAGE"
